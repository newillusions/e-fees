[package]
name = "e-fees-api"
version = "0.3.4"
edition = "2021"
description = "HTTP API for e-fees data"

[dependencies]
e-fees-core = { path = "../crates/e-fees-core", features = ["openapi"] }
emittiv-container-utils = { path = "../../../container-utils/rust", default-features = false, features = ["axum"] }
serde_yaml = "0.9"
axum = "0.8"
axum-extra = { version = "0.10", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
surrealdb = { version = "3.0.4", features = ["protocol-ws", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
chrono = "0.4"
