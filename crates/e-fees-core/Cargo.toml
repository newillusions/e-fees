[package]
name = "e-fees-core"
version = "0.1.0"
edition = "2021"
description = "Core domain models and business logic for e-fees"

[features]
default = []
openapi = ["utoipa"]

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "3.0.4", default-features = false }
surrealdb-types = "3.0.4"
utoipa = { version = "5", optional = true }
rust_xlsxwriter = "0.82"
umya-spreadsheet = "2.3"

[dev-dependencies]
zip = "2"
