[package]
name = "e-fees-core"
version = "0.1.0"
edition = "2021"
description = "Core domain models and business logic for e-fees"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "3.0", default-features = false }
surrealdb-types = "3.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
