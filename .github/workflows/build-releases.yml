name: Build macOS and Windows Releases

# This workflow runs on GitHub's free runners (macOS + Windows)
# Builds are uploaded to Forgejo releases automatically (env vars use GITEA_ prefix for API compatibility)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.10.0)'
        required: true
        default: '0.10.0'

env:
  GITEA_SERVER: https://forge.mms.name
  GITEA_OWNER: emittiv
  GITEA_REPO: fee-prop

jobs:
  build-macos:
    name: Build macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # Apple Silicon only - Intel dropped per decision:boujy4d42i8w7zovifts (2026-06-29)
          - aarch64-apple-darwin  # Apple Silicon (M1/M2/M3)
    outputs:
      sig-aarch64: ${{ steps.get_sig.outputs.sig_aarch64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout container-utils
        run: |
          git clone https://x-access-token:${{ secrets.GITEA_TOKEN }}@forge.mms.name/emittiv/container-utils.git \
            "$GITHUB_WORKSPACE/../../container-utils"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          NOTES_FILE="release-notes/v${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using curated release notes from $NOTES_FILE"
            BODY="$(cat "$NOTES_FILE")"
          else
            echo "No curated notes at $NOTES_FILE - deriving from git log"
            PREV_TAG="$(git describe --tags --abbrev=0 --exclude="v${VERSION}" 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              BODY="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' 2>/dev/null \
                | grep -vE '^- (chore: bump version|chore: [Uu]pdate manifest|chore: lamp-off|Merge pull request)' || true)"
            fi
            if [ -z "${BODY:-}" ]; then
              BODY="Release v${VERSION}"
            fi
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/release_notes.txt"
          echo "Prepared $(wc -l < "$RUNNER_TEMP/release_notes.txt") line(s) of release notes"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Fix code signature
        run: |
          # Find the .app bundle (workspace root target/, not src-tauri/target/)
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Re-signing $APP_PATH to fix CSResourcesFileMapped issue..."
            codesign --force --deep --sign - --preserve-metadata=entitlements,requirements,flags,runtime "$APP_PATH"
            codesign --verify --verbose=4 "$APP_PATH"
          fi

      - name: Recreate DMG with fixed signature
        run: |
          # Find the old DMG and app (workspace root target/, not src-tauri/target/)
          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)

          if [ -n "$DMG_PATH" ] && [ -n "$APP_PATH" ]; then
            echo "Recreating DMG with re-signed app..."
            DMG_DIR=$(dirname "$DMG_PATH")
            DMG_NAME=$(basename "$DMG_PATH")

            # Remove old DMG
            rm "$DMG_PATH"

            # Create new DMG with re-signed app
            hdiutil create -volname "E-Fees" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
            echo "Created new DMG: $DMG_PATH"
          fi

      - name: Create archive name
        id: archive
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            echo "NAME=E-Fees_${{ steps.version.outputs.VERSION }}_aarch64" >> $GITHUB_OUTPUT
            echo "ARCH=aarch64" >> $GITHUB_OUTPUT
          else
            echo "NAME=E-Fees_${{ steps.version.outputs.VERSION }}_x64" >> $GITHUB_OUTPUT
            echo "ARCH=x64" >> $GITHUB_OUTPUT
          fi

      - name: Find artifacts
        id: find_artifacts
        run: |
          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          TARGZ_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz" | head -1)
          SIG_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz.sig" | head -1)
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "TARGZ_PATH=$TARGZ_PATH" >> $GITHUB_OUTPUT
          echo "SIG_PATH=$SIG_PATH" >> $GITHUB_OUTPUT

      - name: Get signature
        id: get_sig
        run: |
          if [ -f "${{ steps.find_artifacts.outputs.SIG_PATH }}" ]; then
            SIG=$(cat "${{ steps.find_artifacts.outputs.SIG_PATH }}")
            if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
              echo "sig_aarch64=$SIG" >> $GITHUB_OUTPUT
            else
              echo "sig_x86_64=$SIG" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create checksum
        run: |
          cd $(dirname "${{ steps.find_artifacts.outputs.DMG_PATH }}")
          shasum -a 256 $(basename "${{ steps.find_artifacts.outputs.DMG_PATH }}") > ${{ steps.archive.outputs.NAME }}.dmg.sha256

      - name: Upload to Gitea Release
        run: |
          # Get or create release with retry logic for race conditions
          MAX_RETRIES=5
          RETRY_DELAY=5
          RELEASE_ID=""

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Getting or creating release..."

            # Try to get existing release
            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/tags/v${{ steps.version.outputs.VERSION }}")

            echo "API Response: $RELEASE_JSON"

            if echo "$RELEASE_JSON" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
              echo "Using existing release: $RELEASE_ID"
              break
            fi

            # Release doesn't exist, try to create it
            echo "Release not found, creating..."
            RELEASE_NOTES="$(cat "$RUNNER_TEMP/release_notes.txt" 2>/dev/null || echo "Release v${{ steps.version.outputs.VERSION }}")"
            CREATE_PAYLOAD=$(jq -n \
              --arg tag "v${{ steps.version.outputs.VERSION }}" \
              --arg name "E-Fees v${{ steps.version.outputs.VERSION }}" \
              --arg body "$RELEASE_NOTES" \
              '{tag_name: $tag, name: $name, body: $body}')
            RELEASE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              -H "Content-Type: application/json" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases" \
              -d "$CREATE_PAYLOAD")

            echo "Create Response: $RELEASE_RESPONSE"

            if echo "$RELEASE_RESPONSE" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
              echo "Created new release: $RELEASE_ID"
              break
            fi

            # Failed, wait and retry (another job may have created it)
            echo "Failed to get/create release, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to get or create release after $MAX_RETRIES attempts"
            exit 1
          fi

          # Upload DMG
          echo "Uploading DMG..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${{ steps.find_artifacts.outputs.DMG_PATH }}" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=${{ steps.archive.outputs.NAME }}.dmg"

          # Upload updater tar.gz (for auto-update)
          if [ -f "${{ steps.find_artifacts.outputs.TARGZ_PATH }}" ]; then
            echo "Uploading tar.gz for updater..."
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              -F "attachment=@${{ steps.find_artifacts.outputs.TARGZ_PATH }}" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=${{ steps.archive.outputs.NAME }}.app.tar.gz"
          fi

          # Upload checksum
          echo "Uploading checksum..."
          cd $(dirname "${{ steps.find_artifacts.outputs.DMG_PATH }}")
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${{ steps.archive.outputs.NAME }}.dmg.sha256" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=${{ steps.archive.outputs.NAME }}.dmg.sha256"

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ steps.archive.outputs.ARCH }}
          path: |
            ${{ steps.find_artifacts.outputs.DMG_PATH }}
            ${{ steps.find_artifacts.outputs.TARGZ_PATH }}
            ${{ steps.find_artifacts.outputs.SIG_PATH }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      sig-windows: ${{ steps.get_sig.outputs.sig_windows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout container-utils
        shell: bash
        run: |
          git clone https://x-access-token:${{ secrets.GITEA_TOKEN }}@forge.mms.name/emittiv/container-utils.git \
            "$GITHUB_WORKSPACE/../../container-utils"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          NOTES_FILE="release-notes/v${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using curated release notes from $NOTES_FILE"
            BODY="$(cat "$NOTES_FILE")"
          else
            echo "No curated notes at $NOTES_FILE - deriving from git log"
            PREV_TAG="$(git describe --tags --abbrev=0 --exclude="v${VERSION}" 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              BODY="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' 2>/dev/null \
                | grep -vE '^- (chore: bump version|chore: [Uu]pdate manifest|chore: lamp-off|Merge pull request)' || true)"
            fi
            if [ -z "${BODY:-}" ]; then
              BODY="Release v${VERSION}"
            fi
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/release_notes.txt"
          echo "Prepared $(wc -l < "$RUNNER_TEMP/release_notes.txt") line(s) of release notes"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Find installers
        id: find_installers
        shell: bash
        run: |
          MSI_PATH=$(find target/release/bundle/msi -name "*.msi" | head -1)
          NSIS_PATH=$(find target/release/bundle/nsis -name "*-setup.exe" | head -1)
          NSIS_SIG=$(find target/release/bundle/nsis -name "*-setup.exe.sig" | head -1)
          echo "MSI_PATH=$MSI_PATH" >> $GITHUB_OUTPUT
          echo "NSIS_PATH=$NSIS_PATH" >> $GITHUB_OUTPUT
          echo "NSIS_SIG=$NSIS_SIG" >> $GITHUB_OUTPUT

      - name: Get signature
        id: get_sig
        shell: bash
        run: |
          if [ -f "${{ steps.find_installers.outputs.NSIS_SIG }}" ]; then
            SIG=$(cat "${{ steps.find_installers.outputs.NSIS_SIG }}")
            echo "sig_windows=$SIG" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Gitea Release
        shell: bash
        run: |
          # Get or create release with retry logic for race conditions
          MAX_RETRIES=5
          RETRY_DELAY=5
          RELEASE_ID=""

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Getting or creating release..."

            # Try to get existing release
            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/tags/v${{ steps.version.outputs.VERSION }}")

            echo "API Response: $RELEASE_JSON"

            if echo "$RELEASE_JSON" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
              echo "Using existing release: $RELEASE_ID"
              break
            fi

            # Release doesn't exist, try to create it
            echo "Release not found, creating..."
            RELEASE_NOTES="$(cat "$RUNNER_TEMP/release_notes.txt" 2>/dev/null || echo "Release v${{ steps.version.outputs.VERSION }}")"
            CREATE_PAYLOAD=$(jq -n \
              --arg tag "v${{ steps.version.outputs.VERSION }}" \
              --arg name "E-Fees v${{ steps.version.outputs.VERSION }}" \
              --arg body "$RELEASE_NOTES" \
              '{tag_name: $tag, name: $name, body: $body}')
            RELEASE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              -H "Content-Type: application/json" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases" \
              -d "$CREATE_PAYLOAD")

            echo "Create Response: $RELEASE_RESPONSE"

            if echo "$RELEASE_RESPONSE" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
              echo "Created new release: $RELEASE_ID"
              break
            fi

            # Failed, wait and retry (another job may have created it)
            echo "Failed to get/create release, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to get or create release after $MAX_RETRIES attempts"
            exit 1
          fi

          # Upload MSI
          echo "Uploading MSI..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${{ steps.find_installers.outputs.MSI_PATH }}" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=E-Fees_${{ steps.version.outputs.VERSION }}_x64.msi"

          # Upload NSIS installer for download and updater
          echo "Uploading NSIS installer..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${{ steps.find_installers.outputs.NSIS_PATH }}" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=E-Fees_${{ steps.version.outputs.VERSION }}_x64-setup.exe"

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            ${{ steps.find_installers.outputs.MSI_PATH }}
            ${{ steps.find_installers.outputs.NSIS_PATH }}
            ${{ steps.find_installers.outputs.NSIS_SIG }}

  update-manifest:
    name: Update manifest
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && needs.build-macos.result != 'cancelled' && needs.build-windows.result != 'cancelled'
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate and display update.json
        id: generate
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIG_AARCH64="${{ needs.build-macos.outputs.sig-aarch64 }}"
          SIG_WIN="${{ needs.build-windows.outputs.sig-windows }}"

          cat > update.json << EOF
          {
            "version": "$VERSION",
            "notes": "Release v$VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIG_AARCH64",
                "url": "https://forge.mms.name/emittiv/fee-prop/releases/download/v$VERSION/E-Fees_${VERSION}_aarch64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$SIG_WIN",
                "url": "https://forge.mms.name/emittiv/fee-prop/releases/download/v$VERSION/E-Fees_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          echo "Generated update.json:"
          cat update.json

      - name: Upload update.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json

      # The updater endpoint reads update.json from THIS repo's main branch on
      # raw.githubusercontent.com, so it must land on GitHub; Forgejo (origin)
      # is the source-of-truth remote for everything else, so it must land
      # there too. Previously these were two INDEPENDENT commits - one via
      # the Gitea contents API, one via a separate clone+commit - which
      # produced two different commit objects (different author/committer
      # metadata) for the identical update.json content. That left origin/main
      # and github/main permanently one "chore: update manifest" commit apart
      # after every release, requiring a manual drift-merge each time
      # (v0.17.0, v0.18.0, v0.18.1 all hit this). Fix: build ONE commit
      # locally, on top of the canonical remote (origin/Forgejo), and push
      # that exact commit object to both remotes so the SHAs match.
      - name: Commit update.json (single commit, pushed to both remotes)
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          UPDATE_JSON="$PWD/update.json"

          git clone "https://x-access-token:${{ secrets.GITEA_TOKEN }}@forge.mms.name/emittiv/fee-prop.git" manifest-repo
          cd manifest-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add github "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          MAX_ATTEMPTS=3
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            git fetch origin main --quiet
            git checkout -B main origin/main --quiet
            cp "$UPDATE_JSON" update.json
            git add update.json

            if git diff --cached --quiet; then
              echo "update.json already current on origin/main - nothing new to commit"
            else
              git commit -m "chore: update manifest for v$VERSION" --quiet
            fi
            echo "Local main is at $(git rev-parse HEAD)"

            ORIGIN_OK=true
            git push origin "HEAD:main" || ORIGIN_OK=false

            if [ "$ORIGIN_OK" = true ] && git push github "HEAD:main"; then
              echo "✅ Pushed identical commit $(git rev-parse HEAD) to origin/main and github/main"
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Failed to sync the manifest commit to both remotes after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "One or both remotes rejected the push (likely advanced) - refetching and retrying ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep 5
          done
