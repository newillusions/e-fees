[package]
name = "app"
version = "0.15.1"
description = "e-fees - Fee Proposal Management System"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.0", features = [ "macos-private-api", "config-toml"] }
tauri-plugin-dialog = "2.2.2"
tauri-plugin-single-instance = "2.2.2"
tokio = { version = "1", features = ["full"] }
surrealdb = { version = "3.0.4", features = ["kv-mem", "protocol-ws", "protocol-http", "rustls"] }
surrealdb-types = "3.0.4"
log = "0.4"
tauri-plugin-log = "2.0.0-rc"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
async-trait = "0.1"
regex = "1.10"
once_cell = "1.19"
tauri-plugin-mcp = { path = "../tauri-plugin-mcp" }
e-fees-core = { path = "../crates/e-fees-core" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Security-focused dependencies
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
# Cross-platform file system operations
fs_extra = "1.3"
# Agent API HTTP server
axum = "0.8"
async-stream = "0.3"
futures-core = "0.3"
dirs = "6"
# Excel export
rust_xlsxwriter = "0.82"
umya-spreadsheet = "2.3"
# HTTP client for scope service queries
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
serial_test = "3.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
