[package]
name = "e-fees-scope"
version = "0.2.0"
edition = "2021"
description = "Scope/deliverables service for e-fees"

[dependencies]
e-fees-core = { path = "../crates/e-fees-core", features = ["openapi"] }
emittiv-container-utils = { path = "../../../container-utils/rust", default-features = false, features = ["axum"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
surrealdb = { version = "3.0.4", features = ["protocol-ws", "rustls"] }
surrealdb-types = "3.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
zip = "2"
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
urlencoding = "2"
